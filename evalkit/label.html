<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyWear eval labeler</title>
<style>
:root{--bg:#0f1115;--card:#171b22;--text:#eef0f4;--mut:#8b93a1;--line:#262c37;--acc:#6c7bff;--ok:#35e08f;--bad:#ff6b5e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:20px;max-width:1100px;margin:0 auto}
h1{font-size:16px;margin-bottom:4px}
.meta{color:var(--mut);font-size:13px;margin-bottom:14px}
.wrap{display:flex;gap:18px;flex-wrap:wrap}
.frameview{position:relative;width:704px;max-width:100%}
.frameview img{width:100%;display:block;border-radius:10px}
.pb{position:absolute;border:2px solid rgba(255,255,255,.35);border-radius:3px}
.pb.cur{border-color:var(--ok);box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.zoom{width:340px;height:440px;overflow:hidden;border-radius:10px;background:#000;position:relative;flex:none}
.zoom img{position:absolute;transform-origin:0 0;filter:brightness(1.25) contrast(1.15) saturate(1.1)}
.panel{flex:1;min-width:280px}
.guess{color:var(--mut);font-size:13px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lbl{font-size:12px;letter-spacing:.6px;color:var(--mut)}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 16px;cursor:pointer}
button.primary{background:var(--ok);border-color:var(--ok);color:#04150c;font-weight:700}
button.warn{color:var(--bad);border-color:var(--bad)}
.keys{margin-top:14px;color:var(--mut);font-size:12px;line-height:1.8}
kbd{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px}
#doneMsg{font-size:20px;padding:60px 0;text-align:center}
</style>
</head>
<body>
<h1>DailyWear eval labeler</h1>
<div class="meta" id="progress">loading…</div>
<div class="wrap" id="ui" style="display:none">
  <div class="frameview" id="fv"><img id="frame"></div>
  <div class="zoom" id="zoomBox"><img id="zoomImg"></div>
  <div class="panel">
    <div class="guess" id="guess"></div>
    <div class="lbl">TOP</div>
    <div class="chips" id="outerChips"></div>
    <div class="lbl">BOTTOM</div>
    <div class="chips" id="bottomChips"></div>
    <div class="chips"><div class="chip" id="umbChip">umbrella</div></div>
    <div class="actions">
      <button class="primary" id="accept">Accept (Enter)</button>
      <button class="warn" id="notPerson">Not a person (X)</button>
      <button id="cantTell">Can't tell (C)</button>
      <button id="skip">Skip (S)</button>
    </div>
    <div class="keys">
      Top: <kbd>1</kbd> jacket <kbd>2</kbd> hoodie <kbd>3</kbd> long sleeve <kbd>4</kbd> tee <kbd>5</kbd> tank ·
      Bottom: <kbd>7</kbd> pants <kbd>8</kbd> shorts <kbd>9</kbd> skirt/dress ·
      <kbd>U</kbd> umbrella · <kbd>B</kbd> brightness boost · <kbd>Enter</kbd> accept
    </div>
  </div>
</div>
<div id="doneMsg" style="display:none">All labeled — run <b>score.py</b> 🎉</div>

<script>
const OUTER=["jacket_or_coat","hoodie","long_sleeve","short_sleeve","sleeveless"];
const ONAMES=["jacket","hoodie","long sleeve","tee","tank"];
const BOTT=["long_pants","shorts","skirt_or_dress"];
const BNAMES=["pants","shorts","skirt/dress"];
let Q=[], i=0, cur={};

async function boot(){
  const manifest = await (await fetch('manifest.json')).json();
  let done = new Set(JSON.parse(localStorage.getItem('dw_done')||'[]'));
  for(const s of manifest)
    s.people.forEach((p,pi)=>{
      const pid = s.key+'#'+pi;
      if(!done.has(pid)) Q.push({pid, frame:s.frame, cam:s.cam, stamp:s.stamp, model:s.model, pred:p});
    });
  if(!Q.length){ finish(); return; }
  document.getElementById('ui').style.display='flex';
  show();
}
function markDone(pid){
  const d = JSON.parse(localStorage.getItem('dw_done')||'[]'); d.push(pid);
  localStorage.setItem('dw_done', JSON.stringify(d));
}
function chipRow(el, names, sel, cb){
  el.innerHTML='';
  names.forEach((nm,idx)=>{
    const c=document.createElement('div'); c.className='chip'+(idx===sel?' on':''); c.textContent=nm;
    c.onclick=()=>cb(idx); el.appendChild(c);
  });
}
function show(){
  const q=Q[i]; cur={outer:OUTER.indexOf(q.pred.outer), bottom:BOTT.indexOf(q.pred.bottoms), umb:!!q.pred.umbrella};
  document.getElementById('progress').textContent=`${i+1} / ${Q.length} — ${q.cam} · ${q.stamp} · model ${q.model}`;
  document.getElementById('guess').textContent=`model says: ${q.pred.outer} / ${q.pred.bottoms}${q.pred.umbrella?' / umbrella':''} (conf ${q.pred.confidence})`;
  const img=document.getElementById('frame'); img.src=q.frame;
  img.onload=()=>{
    const fv=document.getElementById('fv');
    fv.querySelectorAll('.pb').forEach(e=>e.remove());
    const [y0,x0,y1,x1]=q.pred.box_2d.map(v=>v/10);
    const b=document.createElement('div'); b.className='pb cur';
    b.style.cssText=`top:${y0}%;left:${x0}%;height:${y1-y0}%;width:${x1-x0}%`;
    fv.appendChild(b);
    const zi=document.getElementById('zoomImg');
    zi.src=q.frame;
    const zw=340, zh=440, bw=(x1-x0)/100*img.naturalWidth, bh=(y1-y0)/100*img.naturalHeight;
    const sc=Math.min(zw/bw, zh/bh)*0.85;
    zi.style.width=img.naturalWidth*sc+'px';
    zi.style.left=(-x0/100*img.naturalWidth*sc + (zw-bw*sc)/2)+'px';
    zi.style.top =(-y0/100*img.naturalHeight*sc + (zh-bh*sc)/2)+'px';
  };
  paint();
}
function paint(){
  chipRow(document.getElementById('outerChips'), ONAMES, cur.outer, v=>{cur.outer=v;paint();});
  chipRow(document.getElementById('bottomChips'), BNAMES, cur.bottom, v=>{cur.bottom=v;paint();});
  document.getElementById('umbChip').className='chip'+(cur.umb?' on':'');
}
document.getElementById('umbChip').onclick=()=>{cur.umb=!cur.umb;paint();};
async function save(verdict){
  const q=Q[i];
  await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    pid:q.pid, cam:q.cam, stamp:q.stamp, model:q.model, pred:q.pred, verdict,
    truth: verdict==='label' ? {outer:OUTER[cur.outer]||'unclear', bottoms:BOTT[cur.bottom]||'unclear', umbrella:cur.umb} : null
  })});
  markDone(q.pid);
  i++;
  if(i>=Q.length) finish(); else show();
}
function finish(){document.getElementById('ui').style.display='none';document.getElementById('doneMsg').style.display='block';document.getElementById('progress').textContent='done';}
document.getElementById('accept').onclick=()=>save('label');
document.getElementById('notPerson').onclick=()=>save('not_person');
document.getElementById('cantTell').onclick=()=>save('cant_tell');
document.getElementById('skip').onclick=()=>{markDone(Q[i].pid);i++;i>=Q.length?finish():show();};
document.addEventListener('keydown',e=>{
  if(e.key==='Enter')save('label');
  else if(e.key==='x'||e.key==='X')save('not_person');
  else if(e.key==='c'||e.key==='C')save('cant_tell');
  else if(e.key==='s'||e.key==='S'){markDone(Q[i].pid);i++;i>=Q.length?finish():show();}
  else if(e.key>='1'&&e.key<='5'){cur.outer=+e.key-1;paint();}
  else if(e.key>='7'&&e.key<='9'){cur.bottom=+e.key-7;paint();}
  else if(e.key==='u'||e.key==='U'){cur.umb=!cur.umb;paint();}
  else if(e.key==='b'||e.key==='B'){const z=document.getElementById('zoomImg');z.style.filter=z.style.filter.includes('2.0')?'brightness(1.25) contrast(1.15) saturate(1.1)':'brightness(2.0) contrast(1.3)';}
});
boot();
</script>
</body>
</html>
